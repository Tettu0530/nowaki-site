name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new nowaki / runtime release that breaks the site shows up.
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prerender:
    name: Prerender
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm prerender
      - name: Check the output
        run: |
          set -e
          for f in index.html ja/index.html docs/index.html _headers; do test -f "public/$f"; done
          grep -q 'nowaki-island' public/index.html
          ls public/_nowaki/*.js >/dev/null
